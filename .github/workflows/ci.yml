name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # GitHub suppresses workflow runs for events caused by GITHUB_TOKEN, so a release
  # PR merged by a workflow would never trigger the tag/build job. Merge release PRs
  # by hand, or start this workflow manually to finish a pending release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Run mandatory tests
        run: uv run pytest -m "not integration"

  build-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Build package
        run: uv build

      - name: Validate package
        run: uvx --from twine==6.2.0 twine check dist/*

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        if: steps.release.outputs.release_created == 'true'
        run: uv build

      - name: Validate package
        if: steps.release.outputs.release_created == 'true'
        run: uvx --from twine==6.2.0 twine check dist/*

      - name: Attach artifacts to GitHub Release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload
          "${{ steps.release.outputs.tag_name }}"
          dist/* --clobber
